# ============================================================
# Configurações da aplicação RPA Licitações
# ============================================================

spring.application.name=rpa-licitacoes

# ------------------------------------------------------------
# Banco de dados H2 (desenvolvimento)
# Substituir por PostgreSQL/MySQL em produção
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:rpalicitacoes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console H2 (dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------
# Selenium / WebDriver
# ------------------------------------------------------------
selenium.chrome.driver=/usr/bin/chromedriver
selenium.headless=true

# ------------------------------------------------------------
# RPA – Jornal do Licitante
# ------------------------------------------------------------
# Número máximo de cliques no botão "Exibir Mais" para carregar registros
rpa.jornal.max.cliques.exibir.mais=10
# Salvar licitações capturadas no banco automaticamente
rpa.jornal.salvar.banco=true

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.com.rpa.licitacoes=INFO
logging.level.org.springframework=WARN
